<!-- HTML search field -->
<div id="search-container">
<input type="text" id="search-input" placeholder="🔎 Search the archives..." autofocus>
<ul id="results-container"></ul>
</div>
<style>
#search-input:focus {
  outline: none;
  border-color: #92bfdb;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
}
#results-container {
  padding: 0;
  list-style-type: none;
}

#results-container li {
  margin-bottom: 1.5rem;
}

span.post-meta {
  font-size: 1rem;
}
</style>

<!-- Grab search-script.js -->
<script src="/assets/js/searchscript.js" type="text/javascript"></script>

<!-- Configuration -->
<script>
SimpleJekyllSearch({
  searchInput: document.getElementById('search-input'),
  resultsContainer: document.getElementById('results-container'),
  json: '/search.json',
  searchResultTemplate: '<li><a href="{url}">{title}</a><br><span class="post-meta">{date}</span></li>'
})
</script>
